    </linearGradient>
    <radialGradient id="emGlass" cx="46%" cy="46%" r="58%">
      <stop offset="0%" stop-color="#fef3c7"/><stop offset="42%" stop-color="#34d399"/><stop offset="100%" stop-color="#065f46"/>
