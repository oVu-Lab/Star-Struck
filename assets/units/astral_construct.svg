<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="obsM" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#334155"/><stop offset="55%" stop-color="#141d33"/><stop offset="100%" stop-color="#070a14"/>
    </linearGradient>
    <linearGradient id="gOrr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff3cf"/><stop offset="50%" stop-color="#cfa144"/><stop offset="100%" stop-color="#543012"/>
    </linearGradient>
    <radialGradient id="cyFurn" cx="45%" cy="42%" r="60%">
