  <line x1="51" y1="90" x2="51" y2="112" stroke="#52200a" stroke-width="2"/>
  <line x1="59" y1="90" x2="59" y2="112" stroke="#52200a" stroke-width="2"/>
  <line x1="67" y1="90" x2="67" y2="112" stroke="#52200a" stroke-width="2"/>
  <!-- Twin pulse emitter barrels -->
  <rect x="84" y="45" width="30" height="9" rx="3" fill="url(#copp)" stroke="#06121b" stroke-width="1.8"/>
  <rect x="84" y="74" width="30" height="9" rx="3" fill="url(#copp)" stroke="#06121b" stroke-width="1.8"/>
